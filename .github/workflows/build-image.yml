name: Build image
on: 
  push: 
    branches: [main]
  pull:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: install java temurin 14
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin
        cache: 'maven'
    - name: Build image docker
      run: ./mvnw spring-boot:build-image -DskipTestsTests
